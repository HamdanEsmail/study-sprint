<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Study Sprint</title>
    <meta
      name="description"
      content="Pick one study task, run a focus sprint, and keep the queue after refresh."
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!--
      THESIS: One task on a library desk, not a dashboard of study stats.
      OWN-WORLD: Chalk paper, cobalt timer well, ruled queue, Georgia wordmark, ink type.
      STORY: Choose a task, start the clock, return to a saved queue.
      FIRST VIEWPORT: Cobalt timer on the left, ruled task list on the right, Start as the one dominant action.
      FORM: Library desk, seed 74fc2750.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div class="desk">
      <header class="mast">
        <p class="wordmark">Study Sprint</p>
        <p id="save-note" class="mast-note">Saved in this browser only.</p>
      </header>

      <main class="work">
        <section class="timer-well" aria-labelledby="clock">
          <p id="clock" class="clock" aria-live="off">25:00</p>
          <p id="focus-title" class="focus-title">Choose a task, then start</p>
          <div class="timer-actions">
            <button type="button" id="toggle" class="primary">Start</button>
            <button type="button" id="reset">Reset</button>
          </div>
          <fieldset class="modes">
            <legend>Session</legend>
            <label><input id="mode-focus" type="radio" name="mode" value="focus" checked /> Focus</label>
            <label><input id="mode-break" type="radio" name="mode" value="break" /> Break</label>
          </fieldset>
          <p id="complete-note" class="complete-note" aria-live="polite"></p>
        </section>

        <section class="queue" aria-labelledby="queue-heading">
          <h1 id="queue-heading">Queue</h1>
          <form id="add-form" class="add-form">
            <label class="field">
              Task
              <input id="task-title" name="title" maxlength="80" required autocomplete="off" placeholder="Read chapter 4" />
            </label>
            <label class="field field-subject">
              Subject
              <input id="task-subject" name="subject" maxlength="24" autocomplete="off" placeholder="Biology" />
            </label>
            <button type="submit" class="add" id="add-submit">Add</button>
          </form>
          <p id="empty-queue" class="empty">Write the first thing you need to finish.</p>
          <ul id="task-list" class="task-list"></ul>
        </section>
      </main>

      <section class="log" aria-labelledby="log-heading">
        <h2 id="log-heading">Finished sprints</h2>
        <ol id="session-list" class="session-list"></ol>
      </section>

      <footer class="help">
        <p>Space starts or pauses. R resets. N focuses the task field. Add <code>?demo=1</code> for a 12-second timer while testing.</p>
      </footer>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
